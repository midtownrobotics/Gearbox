<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light/dark for every app (the g3_theme cookie on the platform's domain), set before first
      // paint; the system setting without one. @g3/ui's useTheme keeps it in sync after that.
      (function () {
        var saved = document.cookie.match(/(?:^|;\s*)g3_theme=(light|dark)/);
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved ? saved[1] : dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Gearbox: free apps for FIRST Robotics Competition teams. Sign-in, ordering, shop tracking, scouting and more, run by volunteers."
    />
    <title>Gearbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
