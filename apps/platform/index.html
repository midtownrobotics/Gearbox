<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light/dark from the system setting (the platform's domain has no g3_theme cookie).
      (function () {
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Gearbox: free apps for FIRST Robotics Competition teams. Sign-in, ordering, shop tracking, scouting and more, run by volunteers."
    />
    <title>Gearbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
