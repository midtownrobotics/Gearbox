<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light/dark for every app (the g3_theme cookie on the team's domain), set before first
      // paint. @g3/ui's useTheme keeps it in sync after that.
      (function () {
        var saved = document.cookie.match(/(?:^|;\s*)g3_theme=(light|dark)/);
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved ? saved[1] : dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.addEventListener("DOMContentLoaded", function () {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#262626" : "#fefefe";
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fefefe" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Inventory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
