name = "portal"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[env.production]
name = "portal-production"

# The app's page; only /api/* runs the worker code (the rest is the built app, with unknown paths
# falling back to index.html for the app's router). Build it first: `pnpm run deploy` does.
[env.production.assets]
directory = "../../apps/portal/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
