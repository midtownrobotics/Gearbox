# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "edge"
main = "src/index.ts"
compatibility_date = "2026-05-17"

# Daily rollup of 5-minute usage rows into hourly rows (UTC).
[triggers]
crons = ["30 8 * * *"]

[[services]]
binding = "G3ID"
service = "g3id"

[[d1_databases]]
binding = "EDGE_DB"
database_name = "g3-edge-local"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "src/db/migrations"

# Holds the edge box's WebSocket (src/lib/agent-link.ts): the agent connects to
# /api/agent/connect, and the worker's requests to the box go over it.
[[durable_objects.bindings]]
name = "AGENT_LINK"
class_name = "AgentLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentLink"]

[vars]
FRONTEND_URL = "http://localhost:5183"
# Secrets: EDGE_AGENT_KEY (shared with the agent; .dev.vars locally, `wrangler secret put` in prod)

[env.production]
name = "edge-production"
# No workers.dev address: the gateway is the only way in, so its identity headers can be trusted.
workers_dev = false

[env.production.triggers]
crons = ["30 8 * * *"]

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

[[env.production.d1_databases]]
binding = "EDGE_DB"
database_name = "g3-edge-prod"
database_id = "0ba12f11-3577-472f-9998-81017319bd51"
migrations_dir = "src/db/migrations"

[[env.production.durable_objects.bindings]]
name = "AGENT_LINK"
class_name = "AgentLink"

[env.production.vars]
FRONTEND_URL = "https://1648-edge.frcgearbox.com"

# The app's page, served by this worker in production; only /api/* runs the worker code, and
# other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/edge build"

[env.production.assets]
directory = "../../apps/edge/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
