# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "edge"
main = "src/index.ts"
compatibility_date = "2026-05-17"

# Daily rollup of old usage rows, team by team (src/modules/network/index.ts).
[triggers]
crons = ["30 8 * * *"]

[[services]]
binding = "G3ID"
service = "g3id"

[[d1_databases]]
binding = "EDGE_DB"
database_name = "g3-edge-local"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "src/db/migrations"

# Holds each team's edge box WebSocket (src/lib/agent-link.ts, one instance per team): a box
# connects to /api/agent/connect on its team's address, and the worker's requests to it go over it.
[[durable_objects.bindings]]
name = "AGENT_LINK"
class_name = "AgentLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentLink"]

# No secrets: each team's box has its own key, made on the Edge Box page and stored hashed in D1.
# Local dev: `pnpm --filter @g3/worker-edge box-key:set -- --local --key local-dev-agent-key`
# lets the mock agent (mock.env) connect as the site team's box.

[env.production]
name = "edge-production"
# No workers.dev address: the gateway is the only way in, so its identity headers can be trusted.
workers_dev = false

[env.production.triggers]
crons = ["30 8 * * *"]

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

[[env.production.d1_databases]]
binding = "EDGE_DB"
database_name = "g3-edge-prod"
database_id = "0ba12f11-3577-472f-9998-81017319bd51"
migrations_dir = "src/db/migrations"

[[env.production.durable_objects.bindings]]
name = "AGENT_LINK"
class_name = "AgentLink"

# The app's page, served by this worker in production; only /api/* runs the worker code, and
# other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/edge build"

[env.production.assets]
directory = "../../apps/edge/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
