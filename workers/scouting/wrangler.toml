# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "scouting-production"
account_id = "e54a97a23069e7889e8e820c00e520d8"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"

[[services]]
binding = "G3ID"
service = "g3id-production"

[[d1_databases]]
binding = "SCOUTING_DB"
database_name = "g3-scouting-prod"
database_id = "e24f6c2e-72dd-4307-864f-8e1b5dc2c2aa"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "FIELD_MAPS"
bucket_name = "g3-scouting"

[vars]
FRONTEND_URL = "https://1648-scouting.frcgearbox.com"
LOCAL_AUTH_BYPASS = "false"
# Configure SLACK_BOT_TOKEN as a Wrangler secret using the same token as G3ID.
# Configure TBA_AUTH_KEY as a Wrangler secret for event schedules.


# Keep a named production environment for Cloudflare Builds configurations
# that invoke `wrangler deploy --env production`.
[env.production]
name = "scouting-production"
# No workers.dev address: the gateway is the only way in, so its identity headers can be trusted.
workers_dev = false

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.ai]
binding = "AI"

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

[[env.production.d1_databases]]
binding = "SCOUTING_DB"
database_name = "g3-scouting-prod"
database_id = "e24f6c2e-72dd-4307-864f-8e1b5dc2c2aa"
migrations_dir = "src/db/migrations"

[[env.production.r2_buckets]]
binding = "FIELD_MAPS"
bucket_name = "g3-scouting"


[env.production.vars]
FRONTEND_URL = "https://1648-scouting.frcgearbox.com"
LOCAL_AUTH_BYPASS = "false"

# The app's page, served by this worker in production; only /api/* runs the worker code, and
# other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/scouting build"

[env.production.assets]
directory = "../../apps/scouting/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
