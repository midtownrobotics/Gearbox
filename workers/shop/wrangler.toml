# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "shop"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[[services]]
binding = "G3ID"
service = "g3id"

# Printing goes through the edge box (workers/edge -> tunnel -> CUPS).
[[services]]
binding = "EDGE"
service = "edge"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c27ba19a75fb4eb6b93f9d2d47de6c0f"

[[d1_databases]]
binding = "SHOP_DB"
database_name = "g3-shop-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "DRAWINGS"
bucket_name = "g3-bucket"

[[queues.producers]]
binding = "BOM_QUEUE"
queue = "bom-fetch-jobs"

[[queues.consumers]]
queue = "bom-fetch-jobs"

[vars]
FRONTEND_URL = "http://localhost:5174"

[env.production]
name = "shop-production"
# No workers.dev address: the gateway is the only way in, so its identity headers can be trusted.
workers_dev = false

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

[[env.production.services]]
binding = "EDGE"
service = "edge-production"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "db4457ce43c9468eb9ec5a049afa65b1"

[[env.production.d1_databases]]
binding = "SHOP_DB"
database_name = "g3-shop-prod"
database_id = "4e69e7bc-85ce-4f32-859a-40ef6a21ab2a"
migrations_dir = "src/db/migrations"

[[env.production.r2_buckets]]
binding = "DRAWINGS"
bucket_name = "g3-bucket"

[[env.production.queues.producers]]
binding = "BOM_QUEUE"
queue = "bom-fetch-jobs"

[[env.production.queues.consumers]]
queue = "bom-fetch-jobs"

[env.production.vars]
FRONTEND_URL = "https://1648-shop.frcgearbox.com"

[observability.logs]
enabled = true
invocation_logs = true

# The app's page, served by this worker in production; only /api/* runs the worker code, and
# other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/shop build"

[env.production.assets]
directory = "../../apps/shop/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
