# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
#
# The platform: its public site and team sign-up (apps/platform), on the platform's domain. It
# keeps the team registry; G3ID keeps accounts, sessions and Slack connections, and the platform
# signs teams up through G3ID's internal routes.
name = "platform"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[[services]]
binding = "G3ID"
service = "g3id"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "gearbox-platform-local"
database_id = "00000000-0000-0000-0000-000000000009"
migrations_dir = "src/db/migrations"

[vars]
# The Slack app's client ID (the same app as G3ID's). Secret: SLACK_CLIENT_SECRET.
SLACK_CLIENT_ID = ""

[env.production]
name = "platform-production"
# No workers.dev address: the gateway is the only way in.
workers_dev = false

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

# Create with `wrangler d1 create gearbox-platform-prod` and paste its ID here.
[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gearbox-platform-prod"
database_id = "12a64874-012b-4940-bb0f-98ff5a9c5d2e"
migrations_dir = "src/db/migrations"

[env.production.vars]
SLACK_CLIENT_ID = ""

# The platform's pages, served by this worker in production; only /api/* runs the worker code,
# and other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/platform build"

[env.production.assets]
directory = "../../apps/platform/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
