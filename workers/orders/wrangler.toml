# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "orders"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[[services]]
binding = "G3ID"
service = "g3id"

# Part lookups run on the shop's edge box, through the edge worker.
[[services]]
binding = "EDGE"
service = "edge"

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "g3-orders-local"
database_id = "00000000-0000-0000-0000-000000000004"
migrations_dir = "src/db/migrations"

[vars]
FRONTEND_URL = "http://localhost:5184"
# How the browser reaches this worker (through the app's /api proxy in dev); used for OAuth callbacks.
PUBLIC_API_URL = "http://localhost:5184/api"
# Optional secrets (.dev.vars locally, `wrangler secret put` in prod):
#   SLACK_BOT_TOKEN: DMs requesters when a mentor approves; without it nothing is sent.

[env.production]
name = "orders-production"

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

[[env.production.services]]
binding = "EDGE"
service = "edge-production"

# Create with `wrangler d1 create g3-orders-prod` and paste its ID here.
[[env.production.d1_databases]]
binding = "ORDERS_DB"
database_name = "g3-orders-prod"
database_id = "987cdb22-15a0-4a3b-88c1-44330ef725f8"
migrations_dir = "src/db/migrations"


[env.production.vars]
FRONTEND_URL = "https://orders.g3robotics.com"
PUBLIC_API_URL = "https://orders.g3robotics.com/api"

# The app's page, served by this worker in production; only /api/* runs the worker code (the
# rest is the built app, with unknown paths falling back to index.html for the app's router).
# Build it first: `pnpm run deploy` does.
[env.production.assets]
directory = "../../apps/orders/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
