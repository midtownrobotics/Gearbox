# Production URLs, route patterns and TEAM_NUMBER here are written by `pnpm configure` from
# packages/site-config/src/site.ts. Change them there, not here.
name = "skill-tree"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[[services]]
binding = "G3ID"
service = "g3id"

[[d1_databases]]
binding = "SKILL_DB"
database_name = "g3-skill-tree-local"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "src/db/migrations"

[vars]
FRONTEND_URL = "http://localhost:5180"

[env.production]
name = "skill-tree-production"
# No workers.dev address: the gateway is the only way in, so its identity headers can be trusted.
workers_dev = false

[[env.production.services]]
binding = "G3ID"
service = "g3id-production"

# NOTE: create the prod DB with `wrangler d1 create g3-skill-tree-prod`
# and paste its database_id below before deploying.
[[env.production.d1_databases]]
binding = "SKILL_DB"
database_name = "g3-skill-tree-prod"
database_id = "a8a17637-93f3-4fcd-b04a-91181b993673"
migrations_dir = "src/db/migrations"

[env.production.vars]
FRONTEND_URL = "https://skilltree.g3robotics.com"

# The app's page, served by this worker in production; only /api/* runs the worker code, and
# other paths fall back to index.html for the app's router. Wrangler builds the page before
# every production deploy or upload (Cloudflare's Git builds too).
[env.production.build]
command = "pnpm --filter @g3/skill-tree build"

[env.production.assets]
directory = "../../apps/skill-tree/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
