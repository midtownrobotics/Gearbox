packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"
  - "devices/*"

# Versions shared by every package that uses them (`"vitest": "catalog:"`).
catalog:
  # The Workers test pool supports Vitest 4.1.x only.
  "@cloudflare/vitest-pool-workers": 0.22.0
  # One Hono for every worker and @g3/auth, so shared middleware types line up.
  hono: 4.12.19
  vitest: 4.1.11

# pnpm v10 (Cloudflare Pages CI)
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp
  - workerd

# pnpm v11+ (local)
allowBuilds:
  "@biomejs/biome": true
  core-js: false
  esbuild: true
  sharp: true
  workerd: true
