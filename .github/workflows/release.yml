name: release

# main is where work lands; public is what's released (and deployed). Merging main into public
# makes a release: this applies the pending changesets on public (versions, changelogs, platform
# CalVer, RELEASES.md), commits and tags it, then merges public back into main so main has the
# new versions and the used changesets are gone there too. (A real merge, not a cherry-pick, so
# main and public share history and the next main → public merge stays clean. It's the only merge
# commit on main; the deploy key bypasses main's linear-history rule for it.) See RELEASES.md.
#
# Pushes go through a deploy key (secret RELEASE_DEPLOY_KEY) that's on the bypass list of the
# main and public rulesets, since both only accept changes through pull requests. Its push to
# public starts this workflow again, which then finds nothing to release.

on:
  push:
    branches: [public]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply changesets
        run: pnpm release:version

      - name: Commit the release
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changesets to release."
          else
            git add -A
            git commit -m "Release $(node -p 'require("./package.json").version')"
            git push origin public
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it
        run: pnpm release:tag --push

      - name: Merge public back into main
        if: steps.commit.outputs.released == 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff public -m "Merge release $version into main"
          git push origin main
