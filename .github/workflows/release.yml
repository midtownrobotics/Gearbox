name: release

# staging is where work lands; public is what's released (and deployed). Merging staging into public
# makes a release: this applies the pending changesets on public (versions, changelogs, platform
# CalVer, RELEASES.md), commits and tags it, then merges public back into staging so staging has the
# new versions and the used changesets are gone there too. (A real merge, not a cherry-pick, so
# staging and public share history and the next staging → public merge stays clean. It's the only merge
# commit on staging; the deploy key bypasses staging's linear-history rule for it.) See RELEASES.md.
#
# Pushes go through a deploy key (secret RELEASE_DEPLOY_KEY) that's on the bypass list of the
# staging and public rulesets, since both only accept changes through pull requests. Its push to
# public starts this workflow again, which then finds nothing to release.
#
# Then it deploys production (deploy.yml): migrations, every worker, the gateway. Only a run that
# finds nothing left to release deploys, so what goes live is always a released commit: merging
# the release PR commits the release, and that push starts this workflow again, which deploys it.
# A push to public with no changesets deploys straight away. While the repository variable
# PRODUCTION_BRANCH is "staging", production deploys from staging instead (staging.yml) and this doesn't.

on:
  push:
    branches: [public]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.commit.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply changesets
        run: pnpm release:version

      - name: Commit the release
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changesets to release."
          else
            git add -A
            git commit -m "Release $(node -p 'require("./package.json").version')"
            git push origin public
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it
        run: pnpm release:tag --push

      - name: Merge public back into staging
        if: steps.commit.outputs.released == 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          git fetch origin staging
          git checkout -B staging origin/staging
          git merge --no-ff public -m "Merge release $version into staging"
          git push origin staging

  deploy:
    needs: release
    # Not while production deploys from staging (PRODUCTION_BRANCH, staging.yml): public is behind
    # staging, so deploying it would put older code back.
    if: needs.release.outputs.released != 'true' && vars.PRODUCTION_BRANCH != 'staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
