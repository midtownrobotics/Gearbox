name: pit-log-downloader

# The pit log downloader runs on team members' own computers, so it's checked on Linux, Windows
# and macOS: it installs, type checks, builds its status page, starts and answers.

on:
  pull_request:
    paths:
      - "devices/pit-log-downloader/**"
      # Its status page is built from these.
      - "packages/ui/**"
      - "packages/site-config/**"
      - "packages/demo/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pit-log-downloader.yml"
  push:
    branches: [staging]
    paths:
      - "devices/pit-log-downloader/**"
      # Its status page is built from these.
      - "packages/ui/**"
      - "packages/site-config/**"
      - "packages/demo/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pit-log-downloader.yml"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Only the folders a pit computer checks out (DOWNLOADER_FOLDERS in Pit's
      # apps/pit/src/plugins/logs/setup-steps.tsx), so a new one it needs fails here first.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            devices/pit-log-downloader
            packages/site-config
            packages/ui
            packages/demo

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Only the downloader and what it needs, as on a pit computer.
      - run: pnpm install --frozen-lockfile --filter "@g3/pit-log-downloader..."

      - run: pnpm --filter @g3/pit-log-downloader typecheck

      - run: pnpm --filter @g3/pit-log-downloader smoke
