name: staging

# Roadmap 0.2: every push to main deploys staging (<label>-dev.g3robotics.com) through
# deploy.yml. Production deploys from public, through release.yml, unless the repository variable
# PRODUCTION_BRANCH is "main" (a stopgap while releases aren't being cut): then each push to main
# also deploys production, once staging's deploy has gone through, and release.yml doesn't.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  production:
    needs: deploy
    if: vars.PRODUCTION_BRANCH == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
