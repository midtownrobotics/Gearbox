name: reset-dev-env

# Run by hand (Actions → reset-dev-env → Run workflow): puts dev-env back to staging, dropping
# everything merged into it since. dev-env's ruleset only takes merge commits from pull requests and
# blocks force pushes, so this pushes with the deploy key (secret RELEASE_DEPLOY_KEY), which is on its
# bypass list. A deploy key's push starts staging.yml, so staging redeploys while it follows dev-env
# (the repository variable STAGING_BRANCH). docs/deploy.md, "dev-env".

on:
  workflow_dispatch:

concurrency:
  group: reset-dev-env

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Put dev-env back to staging
        run: |
          echo "dev-env was $(git rev-parse --short origin/dev-env 2>/dev/null || echo 'missing'), now $(git rev-parse --short origin/staging)"
          git push --force origin origin/staging:refs/heads/dev-env
