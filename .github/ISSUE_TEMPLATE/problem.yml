name: Problem
description: Something in Gearbox isn't working.
title: "<App>: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The same details Gearbox's Report a problem adds to its issues, so issues read alike however they're made. Start the title with the app's name, as Gearbox does ("Orders: …").
  - type: textarea
    id: message
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Attendance
        - Edge
        - ID
        - Inventory
        - Orders
        - Pit
        - Portal
        - Schedule
        - Scouting
        - Shop
        - Skill Tree
        - Unknown
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address, without anything after a ?.
      placeholder: https://1648-orders.frcgearbox.com/requests
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version, from the menu (beside Report a problem).
      placeholder: Orders 1.4.0
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 141 on Windows
  - type: input
    id: team
    attributes:
      label: Team
      description: The team's number.
      placeholder: "1648"
