name: Problem
description: Something in Gearbox isn't working.
title: "<App>: "
labels: ["from-gearbox", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        The same details Gearbox's Report a problem adds to its issues, so issues read alike however they're made. Start the title with the app's name, as Gearbox does ("Orders: …").
  - type: textarea
    id: message
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App
      description: Attendance, Edge, ID, Inventory, Orders, Pit, Portal, Schedule, Scouting, Shop or Skill Tree.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address, without anything after a ?.
      placeholder: https://1648-orders.frcgearbox.com/requests
  - type: input
    id: app-version
    attributes:
      label: App version
      description: In the app's menu, beside Report a problem.
      placeholder: 1.4.0
  - type: input
    id: platform-version
    attributes:
      label: Platform version
      description: In the app's menu, after "platform".
      placeholder: 2026.10.0
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 141 on Windows
  - type: input
    id: team
    attributes:
      label: Team
      description: The team's number.
      placeholder: "1648"
